<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <title>Music Remote</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="remote.css" />
  </head>
  <body data-live="false">
    <main>
      <section id="pair" hidden>
        <h2 class="pair-title">Pair with your laptop</h2>
        <p class="pair-help">Open the extension on your laptop and type the 12-character code shown at the top.</p>
        <form id="pairForm" autocomplete="off">
          <input
            id="code"
            type="text"
            autocapitalize="characters"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            maxlength="14"
            placeholder="XXXX-XXXX-XXXX"
            aria-label="Pairing code"
          />
          <button class="primary" type="submit">Pair</button>
        </form>
        <p id="pairError" class="pair-error"></p>
      </section>

      <section id="remote" hidden>
        <div id="status" class="status" data-kind="wait">Connecting&hellip;</div>

        <div id="art" class="art" aria-hidden="true"></div>

        <h1 id="title">Nothing playing</h1>
        <p id="artist"></p>

        <div class="controls">
          <button class="btn" data-cmd="previous" aria-label="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z" /></svg>
          </button>

          <button class="btn big toggle" id="toggle" data-cmd="toggle" data-playing="false" aria-label="Play or pause">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
          </button>

          <button class="btn" data-cmd="next" aria-label="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z" /></svg>
          </button>
        </div>

        <div class="volume">
          <svg class="vol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12z" /></svg>
          <input id="volSlider" class="vol-slider" type="range" min="0" max="100" step="1" value="50" aria-label="Volume" />
          <span id="vol">&ndash;</span>
        </div>

        <button class="queue-btn" id="queueOpen" type="button">Up next</button>

        <p class="note">Unofficial. Not affiliated with YouTube or Google.</p>
        <button class="linkbtn" id="unpair" type="button">Unpair</button>
      </section>
    </main>

    <section id="queuePanel" class="sheet" hidden aria-label="Up next">
      <div class="sheet-head">
        <h2>Up next</h2>
        <button id="queueClose" class="sheet-close" type="button" aria-label="Close">&times;</button>
      </div>
      <ol id="queueList" class="queue-list"></ol>
      <p id="queueEmpty" class="queue-empty">No queue yet. Play a song on your laptop.</p>
    </section>

    <script src="carrier.js"></script>
    <script src="remote.js"></script>
  </body>
</html>
